---
- name: Get variables
  local_action:
    module: set_fact
    DOCKER_IMAGE: "{{ lookup('ansible.builtin.env', 'DOCKER_IMAGE') }}"
    REGISTRY_USER: "{{ lookup('ansible.builtin.env', 'REGISTRY_USER') }}"
    JOB_TOKEN: "{{ lookup('ansible.builtin.env', 'JOB_TOKEN') }}"

- debug:
    msg: "DOCKER_IMAGE: {{ DOCKER_IMAGE }}"

- name: login
  ansible.builtin.shell:
    cmd: docker login -u {{ REGISTRY_USER }} -p {{ JOB_TOKEN }} reg.atol.tech

- name: Pull Docker image
  ansible.builtin.shell:
    cmd: docker pull {{ DOCKER_IMAGE }}

