---
variables:
  HOSTS:
    description: "Для заливки контейнера на хосты Биллинга указываем значение prod или stage"
    value: "none"
  CADES_VERSION:
    description: "указать версию контейнера"
    value: "0.1"
  CERT_OWNER:
    description: "при сборке контейнера указать какой пробрасывать сертификат, по-умолчанию тестовый. Указать star, для сертификата Старовойтенко"
    value: "test"


stages:
  - update
  - build
  - push


update files:
    stage: update
    tags:
        - backoffice   
    script:
        
        - cd /etc/ansible-infra/
        - git clone https://"$DEPLOY_USER":"$DEPLOY_PASS"@gitlab.atol.tech/"$CI_PROJECT_PATH".git "$CI_PROJECT_NAME" || true
        - cd "$CI_PROJECT_NAME"
        - git pull

build docker:
    stage: build
    tags:
        - backoffice
    rules:
      - if: '$CERT_OWNER == "star"'
        variables:
          CERT_OWNER_CERT: "./certs/star.pfx"
          CADES_VERSION_TAG: "${CADES_VERSION}.star"
      - if: '$CERT_OWNER == "test"'
        variables:
          CERT_OWNER_CERT: "./certs/test3.pfx"
          CADES_VERSION_TAG: "${CADES_VERSION}.test"
    when: manual  
    script:
        - export PROJECT_PATH="$CI_PROJECT_PATH"
        - echo $CI_PROJECT_PATH
        - export VAULT_ADDR=https://vault.atol.ru
        - export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role=gitlab jwt=$CI_JOB_JWT_V2)"
        - export ANSIBLE_TOKEN="$(vault token create -format=json -ttl=30m | jq -r ".auth.client_token")"
        - export LICENSE_CRYPTOPRO=$(vault kv get -field=LICENSE_CRYPTOPRO gitlab/$PROJECT_PATH)
        - export CERT_PASS=$(vault kv get -field=CERT_PASS gitlab/$PROJECT_PATH)
        - trap 'vault token revoke $ANSIBLE_TOKEN' ERR        
        - cd /etc/ansible-infra/"$CI_PROJECT_NAME"/
        - sudo -E docker build . -t $CI_REGISTRY_IMAGE/cadess:$CADES_VERSION_TAG  --build-arg LICENSE=$LICENSE_CRYPTOPRO --build-arg PFX_FILE=$CERT_OWNER_CERT --build-arg ROOT_PFX_FILE=certs/cert3.crt --build-arg PINCODE=$CERT_PASS
        - sudo -E docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
        - sudo -E docker push $CI_REGISTRY_IMAGE/cadess:$CADES_VERSION_TAG
        - vault token revoke $ANSIBLE_TOKEN

push container:
    stage: push
    tags:
        - backoffice
    rules:
    - if: '$HOSTS != "none"'
    - if: '$HOSTS == "prod"'
      variables:
          ANS_HOSTS: "billing_web"
          DOCKER_IMAGE: "${CI_REGISTRY_IMAGE}/cadess:${CADES_VERSION}.star"
    - if: '$HOSTS == "stage"'
      variables:
          ANS_HOSTS: "billing_web_stage"
          DOCKER_IMAGE: "${CI_REGISTRY_IMAGE}/cadess:${CADES_VERSION}.test"
    script:
        
        - cd /etc/ansible-infra/
        - ansible-playbook docker-cades.yaml -l "$ANS_HOSTS" -e "DOCKER_IMAGE=$DOCKER_IMAGE"

