---
variables:
  HOSTS:
    description: "указать список хостов или группу, по умолчанию none"
    value: "none"

stages:
  - update
  - build
  - start


update files:
    stage: update
    tags:
        - backoffice   
    script:
        
        - cd /etc/ansible-infra/
        - git clone https://"$DEPLOY_USER":"$DEPLOY_PASS"@gitlab.atol.tech/"$CI_PROJECT_PATH".git "$CI_PROJECT_NAME" || true
        - cd "$CI_PROJECT_NAME"
        - git pull

build docker:
    stage: build
    tags:
        - backoffice 
    when: manual  
    script:
        - export PROJECT_PATH="$CI_PROJECT_PATH"
        - echo $CI_PROJECT_PATH
        - export VAULT_ADDR=https://vault.atol.ru
        - export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role=gitlab jwt=$CI_JOB_JWT_V2)"
        - export ANSIBLE_TOKEN="$(vault token create -format=json -ttl=30m | jq -r ".auth.client_token")"
        - export LICENSE_CRYPTOPRO=$(vault kv get -field=LICENSE_CRYPTOPRO gitlab/backoffice/ansible-infra/cryptopro5-docker)
        - export CERT_PASS=$(vault kv get -field=CERT_PASS gitlab/backoffice/ansible-infra/cryptopro5-docker)
        - trap 'vault token revoke $ANSIBLE_TOKEN' ERR        
        - cd /etc/ansible-infra/"$CI_PROJECT_NAME"/
        - sudo -E docker build --build-arg LICENSE_CRYPTOPRO=$LICENSE_CRYPTOPRO --build-arg CERT_PASS=$CERT_PASS -t $CI_REGISTRY_IMAGE/cryptopro .   
        - sudo -E docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
        - sudo -E docker push $CI_REGISTRY_IMAGE/cryptopro
        - vault token revoke $ANSIBLE_TOKEN
